<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(150, 100)">
    <!-- Casa -->
    <polygon points="50,20 10,60 10,120 90,120 90,60" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <!-- Techo -->
    <polygon points="50,10 5,55 95,55" fill="#3b82f6"/>
    <!-- Puerta -->
    <rect x="35" y="85" width="30" height="35" fill="#3b82f6"/>
    <!-- Ventana -->
    <rect x="15" y="70" width="20" height="20" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
    <line x1="25" y1="70" x2="25" y2="90" stroke="#3b82f6" stroke-width="1"/>
    <line x1="15" y1="80" x2="35" y2="80" stroke="#3b82f6" stroke-width="1"/>
  </g>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle">Imagen de demostración</text>
</svg>
