    <line x1="80" y1="75" x2="90" y2="70" stroke="#10b981" stroke-width="2"/>
    <line x1="100" y1="90" x2="110" y2="85" stroke="#10b981" stroke-width="2"/>
    <line x1="120" y1="95" x2="130" y2="90" stroke="#10b981" stroke-width="2"/>
    <line x1="140" y1="85" x2="150" y2="80" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">Imagen de demostración</text>
</svg>
