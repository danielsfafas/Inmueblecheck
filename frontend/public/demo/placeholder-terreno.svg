<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <g transform="translate(100, 100)">
    <!-- Terreno delimitado -->
    <rect x="20" y="20" width="160" height="100" fill="#ffffff" stroke="#10b981" stroke-width="3" stroke-dasharray="10,5"/>
    <!-- Pasto -->
    <line x1="30" y1="50" x2="40" y2="45" stroke="#10b981" stroke-width="2"/>
    <line x1="35" y1="55" x2="45" y2="50" stroke="#10b981" stroke-width="2"/>
    <line x1="50" y1="60" x2="60" y2="55" stroke="#10b981" stroke-width="2"/>
    <line x1="70" y1="45" x2="80" y2="40" stroke="#10b981" stroke-width="2"/>
    <line x1="90" y1="55" x2="100" y2="50" stroke="#10b981" stroke-width="2"/>
    <line x1="110" y1="65" x2="120" y2="60" stroke="#10b981" stroke-width="2"/>
    <line x1="130" y1="50" x2="140" y2="45" stroke="#10b981" stroke-width="2"/>
    <line x1="150" y1="70" x2="160" y2="65" stroke="#10b981" stroke-width="2"/>
    
    <line x1="40" y1="80" x2="50" y2="75" stroke="#10b981" stroke-width="2"/>
